<style>

display:flex;flex-direction:column;gap:5px}.controls .search{flex:1;min-width:210px}input,select,button{padding:10px 12px;border:1px solid #cbd5ca;border-radius:8px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:#e8eee5}#result{font-size:13px;color:var(--muted);margin:12px 0 20px}.month{font-size:18px;margin:26px 0 12px;border-left:4px solid #c7ab52;padding-left:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s}.card:hover{transform:translateY(-3px);border-color:#8caa90}.thumb{position:relative;aspect-ratio:16/9;background:#dde5db;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:10px;bottom:9px;background:#14251ee6;color:white;border-radius:4px;font-size:12px;padding:1px 6px}.cardbody{padding:16px}.meta{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}.card h3{font-size:16px;line-height:1.6;margin:10px 0 14px;min-height:51px;word-break:keep-all}.cardfoot{display:flex;justify-content:space-between;font-size:13px}.views{font-weight:bold;color:var(--green)}.watch{color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px 0;margin-top:32px;color:var(--muted);font-size:12px}.empty{padding:60px;text-align:center;background:white;border-radius:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:13px}th{background:#e8eee5;white-space:nowrap}td:nth-child(2){min-width:240px}td:not(:nth-child(2)){white-space:nowrap}td a:hover{text-decoration:underline}.tablewrap{border:1px solid var(--line);border-radius:12px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.overview{grid-template-columns:1fr}h1{font-size:27px}}@media(max-width:540px){header{padding:28px 20px}header .top{display:block}.pill{margin-top:16px}main{padding:22px 16px}.cards{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:16px}.stat strong{font-size:24px}.stat small{font-size:11px}.yearrow{grid-template-columns:40px 1fr 128px;gap:8px}.controls label:not(.search){flex:1}.controls select{width:100%}h1{font-size:25px}.card h3{min-height:0}.panel{padding:18px}}
.view-buttons{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.view-buttons button[aria-pressed="true"]{background:#1f5940;color:white;border-color:#1f5940}.simple-list{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.simple-row{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid #edf0eb}.simple-row:last-child{border-bottom:0}.simple-row a{display:flex;align-items:center;gap:8px;color:#245cbb;font-weight:600;min-width:0}.simple-row a:hover{text-decoration:underline}.yt-icon{width:20px;height:14px;background:#ff003b;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.yt-icon:after{content:"";border-left:6px solid white;border-top:3px solid transparent;border-bottom:3px solid transparent;margin-left:2px}.simple-meta{font-size:12px;color:var(--muted);white-space:nowrap}.simple-meta time{margin-right:16px}@media(max-width:540px){.simple-row{display:block;padding:15px}.simple-meta{margin:6px 0 0 28px}.view-buttons button{flex:1;padding:10px 8px}header p{word-break:keep-all}}</style>
<header><div class="top"><div><div class="eyebrow">NIKON SCHOOL ARCHIVE</div><h1>엘란비탈 박성욱 작가 니콘 강의</h1><p>날짜로 돌아보고 조회수로 살펴보는 온라인 사진 강의</p></div><a class="pill" href="/login?redirect=%2Fnikon-lectures" id="accountLink">SMAC 로그인</a></div></header>
<main><section id="memberGate" class="panel" style="margin-bottom:24px"><h2>인기 강의 3편은 누구나 볼 수 있습니다</h2><p>SMAC 회원가입 후 로그인하면 전체 48편을 날짜별로 찾아볼 수 있습니다.</p><a href="/signup?redirect=%2Fnikon-lectures" class="pill" style="background:#1f5940;color:white">회원가입하고 전체 강의 보기</a> <a href="/login?redirect=%2Fnikon-lectures" class="pill">기존 회원 로그인</a><p id="authStatus" role="status"></p></section><section class="stats" id="stats" aria-label="전체 강의 요약"></section><div class="overview"><section class="panel"><h2>연도별 강의와 누적 조회수</h2><div id="years"></div><small style="color:var(--muted)">막대는 연도별 강의 수를 나타냅니다</small></section><section class="panel"><h2>가장 많이 본 강의</h2><div id="ranking"></div></section></div>
<section><h2>날짜별 강의 목록</h2><div class="controls"><label class="search">강의 검색<input id="search" placeholder="강의 제목 검색" type="search"></label><label>연도<select id="year"><option value="">전체 연도</option></select></label><label>정렬<select id="sort"><option value="new">최신 강의순</option><option value="old">오래된 강의순</option><option value="views">조회수 높은순</option></select></label><select id="mode" hidden aria-label="보기 방식"><option value="cards">썸네일 보기</option><option value="simple">간단 목록</option><option value="table">상세 표</option></select><button id="reset">초기화</button></div><div class="view-buttons" role="group" aria-label="보기 방식 선택"><button data-mode="cards" aria-pressed="true">썸네일 보기</button><button data-mode="simple" aria-pressed="false">간단 목록</button><button data-mode="table" aria-pressed="false">상세 표</button></div><div id="result" role="status" aria-live="polite"></div><div id="list"></div></section>
<footer id="note"></footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="/js/config.js"></script><script id="data" type="application/json">{"checkedAt": "2026-10-22T00:06:53+09:00", "source": "https://www.youtube.com/playlist?list=PL_iPUKJ6SjWGwcSW7YWHB6HEIjuT3VI7B", "videos": [{"id": "wn17DkTqbmk", "title": "역광사진 잘 찍는 법", "originalTitle": "역광사진 잘 찍는 법 /  박성욱 작가", "url": "https://www.youtube.com/watch?v=wn17DkTqbmk", "date": "2024-05-07", "dateType": "라이브 시작일", "published": "2024-05-07T17:13:54-07:00", "liveStart": "2024-05-07T10:56:36+00:00", "views": 41212, "seconds": 4154, "thumbnail": "https://i.ytimg.com/vi/wn17DkTqbmk/mqdefault.jpg"}, {"id": "oA_mtOAVOCU", "title": "꼭 필요한 카메라 설정과 촬영법1", "originalTitle": "꼭 필요한 카메라 설정과 촬영법1 / 박성욱 작가", "url": "https://www.youtube.com/watch?v=oA_mtOAVOCU", "date": "2024-02-20", "dateType": "라이브 시작일", "published": "2024-02-20T16:14:51-08:00", "liveStart": "2024-02-20T10:58:59+00:00", "views": 19067, "seconds": 4125, "thumbnail": "https://i.ytimg.com/vi/oA_mtOAVOCU/mqdefault.jpg"}, {"id": "4QEzoOMmsIY", "title": "겨울 설경사진 잘 찍는 법", "originalTitle": "겨울 설경사진 잘 찍는 법 / 박성욱 작가", "url": "https://www.youtube.com/watch?v=4QEzoOMmsIY", "date": "2023-12-12", "dateType": "라이브 시작일", "published": "2023-12-12T16:20:17-08:00", "liveStart": "2023-12-12T11:00:02+00:00", "views": 31126, "seconds": 4385, "thumbnail": "https://i.ytimg.com/vi/4QEzoOMmsIY/mqdefault.jpg"}], "summary": {"count": 48, "views": 381156, "seconds": 207955, "startDate": "2023-05-12", "endDate": "2026-10-07", "years": [{"year": "2026", "count": 10, "views": 59649}, {"year": "2025", "count": 15, "views": 87532}, {"year": "2024", "count": 16, "views": 175659}, {"year": "2023", "count": 7, "views": 58316}]}}</script><script>
const data=JSON.parse(document.querySelector('#data').textContent), videos=data.videos, $=s=>document.querySelector(s), fmt=n=>n.toLocaleString('ko-KR'), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), duration=s=>[Math.floor(s/3600),Math.floor(s%3600/60).toString().padStart(2,'0'),(s%60).toString().padStart(2,'0')].join(':'), sum=vs=>vs.reduce((a,v)=>a+v.views,0);
function refreshOverview(){const summary=data.summary, rankedVideos=[...videos].sort((a,b)=>b.views-a.views), visibleYears=[...new Set(videos.map(v=>v.date.slice(0,4)))].sort().reverse();
$('#stats').innerHTML=[['전체 강의',summary.count+'편',summary.startDate+' ~ '+summary.endDate],['누적 조회수',fmt(summary.views)+'회','전체 48편의 조회수 합계'],['강의당 평균',fmt(Math.round(summary.views/summary.count))+'회','누적 조회수 ÷ 전체 강의 수'],['총 강의 시간',(summary.seconds/3600).toFixed(1)+'시간','전체 48편의 재생시간 합계']].map(x=>`<div class="stat"><label>${x[0]}</label><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');
const counts=summary.years.map(row=>row.count);
$('#years').innerHTML=summary.years.map((row,i)=>`<div class="yearrow"><b>${row.year}</b><div class="track"><div class="fill" style="width:${counts[i]/Math.max(...counts)*100}%"></div></div><span>${row.count}편 · ${fmt(row.views)}회</span></div>`).join('');
$('#ranking').innerHTML=rankedVideos.slice(0,3).map((v,i)=>`<div class="rank"><b>0${i+1}</b><a href="${v.url}" target="_blank" rel="noopener">${esc(v.title)}</a><span>${fmt(v.views)}회</span></div>`).join('');
const savedYear=$('#year').value;$('#year').length=1;visibleYears.forEach(y=>$('#year').add(new Option(y+'년',y)));$('#year').value=visibleYears.includes(savedYear)?savedYear:'';}refreshOverview();
const checked=new Date(data.checkedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});
$('#note').innerHTML=`조회수 확인 ${checked} KST · 조회수는 확인 시점의 저장값이며 자동 갱신되지 않습니다.<br>날짜는 라이브 시작일을 한국시간으로 환산했습니다. 라이브 정보가 없는 경우 게시일을 사용합니다.<br>엘란비탈 박성욱 작가 강의 48편 중 조회수 상위 3편은 공개이며, 나머지 45편은 SMAC 로그인 후 열람할 수 있습니다. 유튜브 원본 영상의 공개 상태는 변경되지 않습니다.`;
function filtered(){let vs=videos.filter(v=>(!$('#year').value||v.date.startsWith($('#year').value))&&v.title.toLowerCase().includes($('#search').value.trim().toLowerCase()));return vs.sort((a,b)=>$('#sort').value==='views'?b.views-a.views:$('#sort').value==='old'?a.date.localeCompare(b.date):b.date.localeCompare(a.date))}
function card(v){return `<article class="card"><a href="${v.url}" target="_blank" rel="noopener" aria-label="${esc(v.title)} 영상 보기"><div class="thumb"><img loading="lazy" src="${v.thumbnail}" alt="${esc(v.title)} 유튜브 썸네일"><span class="duration">${duration(v.seconds)}</span></div><div class="cardbody"><div class="meta"><time>${v.date}</time><span>${v.dateType}</span></div><h3>${esc(v.title)}</h3><div class="cardfoot"><span class="views">조회수 ${fmt(v.views)}회</span><span class="watch">영상 보기 ↗</span></div></div></a></article>`}
function simple(v){return `<div class="simple-row"><a href="${v.url}" target="_blank" rel="noopener"><span class="yt-icon" aria-hidden="true"></span><span>${esc(v.title)}</span></a><div class="simple-meta"><time>${v.date}</time><span>조회수 ${fmt(v.views)}회</span></div></div>`}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===$('#mode').value)));try{localStorage.setItem('nikon-view-mode',$('#mode').value)}catch(e){}const vs=filtered();$('#result').textContent=`${vs.length}편 표시 · 조회수 합계 ${fmt(sum(vs))}회 · 확인 ${checked}`;if(!vs.length){$('#list').innerHTML='<div class="empty">검색 결과가 없습니다. 다른 검색어나 연도를 선택해 주세요.</div>';return}if($('#mode').value==='table'){$('#list').innerHTML='<div class="tablewrap"><table><thead><tr><th>강의일</th><th>강의 제목</th><th>조회수</th><th>재생시간</th></tr></thead><tbody>'+vs.map(v=>`<tr><td>${v.date}</td><td><a href="${v.url}" target="_blank" rel="noopener">${esc(v.title)} ↗</a></td><td>${fmt(v.views)}회</td><td>${duration(v.seconds)}</td></tr>`).join('')+'</tbody></table></div>';return}const draw=$('#mode').value==='simple'?simple:card, cls=$('#mode').value==='simple'?'simple-list':'cards';if($('#sort').value==='views'){$('#list').innerHTML='<div class="'+cls+'">'+vs.map(draw).join('')+'</div>';return}let groups={};vs.forEach(v=>(groups[v.date.slice(0,7)]??=[]).push(v));$('#list').innerHTML=Object.entries(groups).map(([m,rows])=>`<h3 class="month">${m.slice(0,4)}년 ${Number(m.slice(5))}월 <small style="font-weight:normal;color:var(--muted)">${rows.length}편</small></h3><div class="${cls}">${rows.map(draw).join('')}</div>`).join('')}
try{const saved=localStorage.getItem('nikon-view-mode');if(['cards','simple','table'].includes(saved))$('#mode').value=saved}catch(e){}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{$('#mode').value=b.dataset.mode;render()});
['#search','#year','#sort','#mode'].forEach(s=>$(s).addEventListener('input',render));$('#reset').onclick=()=>{$('#search').value='';$('#year').value='';$('#sort').value='new';$('#mode').value='cards';render()};
render();

const publicVideos=videos.map(v=>({...v}));let authRequest=0;
async function loadMemberVideos(session){
 const request=++authRequest;
 videos.splice(0,videos.length,...publicVideos);refreshOverview();render();$('#memberGate').hidden=false;
 $('#accountLink').textContent='SMAC 로그인';$('#accountLink').href='/login?redirect=%2Fnikon-lectures';
 if(!session){$('#authStatus').textContent='';return;}
 $('#authStatus').textContent='회원 정보를 확인하고 있습니다.';
 try{
  const response=await fetch('/api/nikon-lectures',{headers:{Authorization:'Bearer '+session.access_token},cache:'no-store'});
  if(!response.ok)throw new Error('회원 확인이 되지 않았습니다. 다시 로그인해 주세요.');
  const result=await response.json();if(request!==authRequest)return;
  if(result.videos.length!==48)throw new Error('강의 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');
  videos.splice(0,videos.length,...result.videos);refreshOverview();render();$('#memberGate').hidden=true;
  $('#accountLink').textContent='로그아웃';$('#accountLink').href='#';
 }catch(e){if(request===authRequest)$('#authStatus').textContent=e.message||'회원 확인 중 오류가 발생했습니다.';}
}
let memberClient;
if(window.supabase && typeof SUPABASE_URL!=='undefined'){
 memberClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 memberClient.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>loadMemberVideos(session),0)});
}else{$('#authStatus').textContent='로그인 연결을 불러오지 못했습니다. 새로고침해 주세요.';}
$('#accountLink').addEventListener('click',async e=>{if($('#accountLink').textContent==='로그아웃'){e.preventDefault();await memberClient.auth.signOut();loadMemberVideos(null);}});
</script></html>
