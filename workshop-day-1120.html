<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>민주평통 청년기자단 워크숍 당일 강의 체크리스트</title>
<meta property="og:type" content="website">
<meta property="og:title" content="민주평통 청년기자단 워크숍 당일 강의 체크리스트">
<meta property="og:description" content="함께 확인하고 함께 편집하는 공유 페이지">
<meta property="og:url" content="https://www.smacedu.kr/workshop-day-1120">
<meta property="og:image" content="https://www.smacedu.kr/workshop-prep-assets/og_workshop_prep.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<style>
:root{--bg:#faf5ec;--card:#fffdf8;--ink:#2b2622;--sub:#6f655b;--line:#e6dccb;--clay:#b85c38;--clay-d:#8f4527;--clay-l:#f6e4d8;--ok:#4f7a4f;--ok-l:#e5f0e2;--hl:#fff1cf}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header{padding:36px 0 20px}
.kicker{color:var(--clay-d);font-weight:700;font-size:14px;letter-spacing:.02em}
h1{margin:6px 0 8px;font-size:28px;line-height:1.3}
.lead{color:var(--sub);margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:18px}
.bar-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.who{display:flex;gap:8px;align-items:center;font-size:14px}
.who input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;width:130px;background:#fff}
.status{font-size:13px;color:var(--sub)}
.status.err{color:#b3261e;font-weight:700}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--clay);transition:width .3s}
section{margin:30px 0}
h2{font-size:21px;margin:0 0 4px}
.hint{color:var(--sub);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.facts{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin:0}
.facts dt{color:var(--sub);font-weight:700}
.facts dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{color:var(--sub);font-size:13px}
tr.mine td{background:var(--hl)}
.tag{display:inline-block;background:var(--clay-l);color:var(--clay-d);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700}
.group h3{margin:22px 0 8px;font-size:17px;color:var(--clay-d)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item.done{background:var(--ok-l);border-color:#c7dcc3}
.row{display:flex;gap:10px;align-items:flex-start}
.row input[type=checkbox]{width:22px;height:22px;margin-top:3px;accent-color:var(--clay);flex:none}
.q{font-weight:700}
.d{color:var(--sub);font-size:14px;margin-top:2px}
.d ul{margin:4px 0 0;padding-left:20px}
.ctl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:flex-start}
.ctl select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff}
.ctl textarea{flex:1;min-width:220px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14.5px;resize:vertical;background:#fff}
.meta{font-size:12px;color:var(--sub);margin-top:4px}
.del{border:0;background:none;color:#b3261e;cursor:pointer;font-size:13px}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
button.btn{background:var(--clay);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
button.btn:hover{background:var(--clay-d)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
details.done{background:var(--ok-l);border-color:#c7dcc3}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
summary small{display:block;font-weight:400;color:var(--sub);font-size:14px}
.idea-body{margin-top:10px;overflow-x:auto}
.pick{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:700}
.pick input{width:20px;height:20px;accent-color:var(--clay)}
.note{background:var(--clay-l);border-radius:10px;padding:10px 14px;font-size:14.5px;margin-top:10px}
#notes{width:100%;min-height:160px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;resize:vertical}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
a.vid{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink)}
a.vid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--line)}
a.vid .vt{font-weight:700;margin-top:4px}
a.vid .vs{font-size:12.5px;color:var(--clay-d)}
a.vid .vd{font-size:13.5px;color:var(--sub)}
a.vid:hover{border-color:var(--clay)}
.nav{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0 14px}
.nav a{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:14px;color:var(--ink);text-decoration:none}
.nav a:hover{border-color:var(--clay);color:var(--clay-d)}
.nav a.opt{background:var(--clay-l);border-color:#ebcdb9;color:var(--clay-d);font-weight:700}
section{scroll-margin-top:70px}
.c5s{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
figure.c5{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
figure.c5 img{width:100%;border-radius:6px;display:block}
figure.c5 figcaption{font-size:12.5px;color:var(--sub);padding:4px 2px 0}
footer{color:var(--sub);font-size:13px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:560px){h1{font-size:23px}.facts{grid-template-columns:1fr}.who input{width:100px}th:nth-child(1),td:nth-child(1){white-space:nowrap}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kicker">스마트미디어아트센터</div>
  <h1>당일 강의 체크리스트</h1>
  <p class="lead">미팅에서 정하지 않고 행사 당일 강의에서 정하는 항목입니다.</p>
  <p style="margin:10px 0 0"><a href="/workshop-prep-1120" style="color:var(--clay-d);font-weight:700">준비 체크리스트로 돌아가기</a></p>
</header>
<div class="bar"><div class="bar-in"><div class="status" id="status">불러오는 중</div></div></div>

<section>
  <h2>당일 정할 것</h2>
  <p class="hint">체크와 메모는 준비 체크리스트 페이지와 같은 저장소에 저장됩니다. 영상 과제 아이디어 4안은 <a href="/workshop-prep-1120#ideas-sec" style="color:var(--clay-d);font-weight:700">준비 체크리스트 페이지</a>에 있습니다.</p>
  <div id="items"></div>
</section>

<footer>이 페이지는 주소를 아는 사람만 열 수 있고 검색에 노출되지 않습니다.</footer>
</div>
<script>
(function(){
var ITEMS=[
 {id:'b5',q:'조별 과제 주제 범위',d:'당일 강의에서 정합니다. 수정안은 지역 평화통일 활동, 현장 행사, K컬처와 평화통일 공공외교 등에서 팀별 선택이고, 결과물 길이는 협의로 정하되 3분 내외가 적당하고, 화면 방향과 비율은 팀별입니다. 영상 과제 아이디어를 활용할지 현장에서 정하기'}
];
var API='/api/workshop-prep';
var state={items:{},rev:0};var timers={};var busy=0;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(iso){if(!iso)return '';var d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function setStatus(t,err){var s=$('#status');s.textContent=t;s.className='status'+(err?' err':'')}
function it(id){return state.items[id]||{}}
function itemHTML(x){
  var s=it(x.id);
  return '<div class="item'+(s.done?' done':'')+'" data-id="'+x.id+'"><div class="row"><input type="checkbox" '+(s.done?'checked':'')+' aria-label="완료"><div style="flex:1"><div class="q">'+esc(x.q)+'</div><div class="d">'+x.d+'</div></div></div>'+
   '<div class="ctl"><select data-f="owner" aria-label="담당"><option value="">담당 미정</option><option'+(s.owner==='센터'?' selected':'')+'>센터</option><option'+(s.owner==='기관'?' selected':'')+'>기관</option><option'+(s.owner==='공동'?' selected':'')+'>공동</option></select>'+
   '<textarea data-f="memo" placeholder="메모" aria-label="메모">'+esc(s.memo||'')+'</textarea></div>'+
   (s.at?'<div class="meta">'+fmt(s.at)+' 수정</div>':'')+'</div>';
}
function render(){
  var ae=document.activeElement;
  if(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'))return;
  $('#items').innerHTML=ITEMS.map(itemHTML).join('');
}
function send(op){
  op.by='';busy++;setStatus('저장 중');
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(op)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j})}).then(function(j){
    busy--;state=j;setStatus('저장됨 '+fmt(j.updatedAt));return j;
  }).catch(function(e){busy--;setStatus('저장 연결 실패, 잠시 후 다시 시도해 주세요',true);throw e});
}
function setLocal(id,f){var c=state.items[id]||{};for(var k in f)c[k]=f[k];c.at=new Date().toISOString();state.items[id]=c}
document.addEventListener('change',function(e){
  var t=e.target,box=t.closest('[data-id]');if(!box)return;var id=box.getAttribute('data-id');
  if(t.type==='checkbox'){setLocal(id,{done:t.checked});render();send({op:'set',id:id,fields:{done:t.checked}}).then(render,function(){})}
  else if(t.getAttribute('data-f')==='owner'){setLocal(id,{owner:t.value});send({op:'set',id:id,fields:{owner:t.value}}).then(function(){render()},function(){})}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.getAttribute&&t.getAttribute('data-f')==='memo'){var box=t.closest('[data-id]'),id=box.getAttribute('data-id');state.items[id]=Object.assign({},state.items[id],{memo:t.value});clearTimeout(timers[id]);timers[id]=setTimeout(function(){send({op:'set',id:id,fields:{memo:t.value}}).then(function(){if(document.activeElement.tagName!=='TEXTAREA')render()},function(){})},900)}
});
function pull(){
  if(busy)return;
  var ae=document.activeElement;if(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'))return;
  fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j&&typeof j.rev==='number'&&j.rev!==state.rev){state=j;render()}setStatus('연결됨')}).catch(function(){setStatus('저장 연결 실패, 잠시 후 다시 시도해 주세요',true)});
}
render();pull();setInterval(pull,12000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
})();
</script>
</body>
</html>
