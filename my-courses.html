<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta name="description" content="스마트미디어아트센터 수강생 통합 조회 - 접수, 입금, 과제, 자격증, 녹화본을 한 화면에서 확인">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="canonical" href="https://www.smacedu.kr/my-courses">
  <meta name="theme-color" content="#10243c">
  <title>내 수강 현황 조회</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2310243c'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%2315a7b8' stroke-width='6'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink:#10243c; --muted:#5e6b78; --paper:#f6f8fb; --white:#fff; --line:#d9e1ea; --gold:#f4c15d; --cyan:#15a7b8; --ok:#137a63; --ok-bg:#e8f6f1; --wait:#9b5a00; --wait-bg:#fff4e0; --na:#6b7785; --na-bg:#eef1f5; }
    * { box-sizing:border-box; }
    html { font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--paper); color:var(--ink); }
    body { margin:0; min-height:100vh; background:linear-gradient(180deg,#eaf2f7 0,#f6f8fb 42rem); }
    button,input { font:inherit; }
    .topline { height:7px; background:linear-gradient(90deg,var(--gold),#f09a55,var(--cyan)); }
    main { width:min(100% - 32px,760px); margin:0 auto; padding:36px 0 54px; }
    header { display:grid; gap:12px; margin-bottom:22px; }
    .brand { color:#426076; font-size:.9rem; font-weight:700; letter-spacing:.02em; }
    h1 { margin:0; font-size:clamp(1.9rem,7vw,3rem); line-height:1.1; letter-spacing:-.045em; }
    .lead { margin:0; color:var(--muted); font-size:1.02rem; line-height:1.7; }
    .card { background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:24px; box-shadow:0 20px 60px rgba(26,55,82,.11); padding:clamp(20px,5vw,34px); }
    .updated { display:inline-flex; align-items:center; gap:8px; color:#416075; font-size:.84rem; font-weight:700; margin-bottom:18px; }
    .updated::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 0 4px #dff5f7; }
    label { display:block; font-size:1rem; font-weight:800; margin-bottom:10px; }
    .search-row { display:grid; grid-template-columns:1fr auto; gap:10px; }
    input { width:100%; min-width:0; border:2px solid #c7d2dd; border-radius:13px; padding:15px 16px; background:#fff; color:var(--ink); font-size:1rem; outline:none; }
    input:focus { border-color:var(--cyan); box-shadow:0 0 0 4px rgba(21,167,184,.14); }
    button { border:0; border-radius:13px; padding:0 22px; min-height:56px; background:var(--ink); color:#fff; font-weight:800; cursor:pointer; }
    button:hover { background:#183756; }
    button:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    .hint { margin:9px 0 0; color:var(--muted); font-size:.86rem; line-height:1.55; }
    #out { margin-top:22px; display:grid; gap:14px; }
    .notice { border-radius:14px; padding:15px 16px; background:var(--wait-bg); color:#754400; line-height:1.6; }
    .section { border:1px solid var(--line); border-radius:18px; background:#f9fbfd; padding:16px; }
    .section h2 { margin:0 0 10px; font-size:1.02rem; display:flex; align-items:center; gap:8px; }
    .section h2 span.num { flex:0 0 26px; width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-size:.8rem; }
    .lines { display:grid; gap:8px; }
    .line { border-radius:12px; padding:11px 13px; line-height:1.5; font-size:.94rem; overflow-wrap:anywhere; }
    .line strong { display:block; font-size:.95rem; }
    .line.ok { background:var(--ok-bg); color:#075b49; }
    .line.wait { background:var(--wait-bg); color:#754400; }
    .line.na { background:var(--na-bg); color:var(--na); }
    .line small { display:block; margin-top:2px; font-size:.85rem; opacity:.9; }
    .line a { display:inline-block; margin:6px 8px 0 0; padding:8px 12px; border-radius:10px; background:var(--ink); color:#fff; text-decoration:none; font-weight:800; font-size:.88rem; }
    .foot { margin:20px 0 0; color:var(--muted); font-size:.85rem; line-height:1.6; }
    @media (max-width:420px) { .search-row { grid-template-columns:1fr; } button { min-height:52px; } main { padding-top:26px; } }
  </style>
</head>
<body>
  <div class="topline"></div>
  <main>
    <header>
      <div class="brand">스마트미디어아트센터</div>
      <h1>내 수강 현황 조회</h1>
      <p class="lead">신청서를 낸 이름, 이메일 또는 전화번호로 조회하면 접수, 입금, 과제, 자격증, 녹화본 상태를 한 화면에서 볼 수 있습니다.</p>
    </header>
    <section class="card">
      <div class="updated" id="updated">자료를 불러오는 중입니다</div>
      <form id="form" autocomplete="off">
        <label for="q">이름, 이메일 또는 전화번호</label>
        <div class="search-row">
          <input id="q" name="q" type="text" inputmode="text" placeholder="예: 홍길동 / 이메일 / 010-0000-0000" required>
          <button type="submit">조회</button>
        </div>
        <p class="hint">신청서에 적은 정보와 같게 입력해 주세요. 녹화본 링크는 이메일 또는 전화번호로 조회할 때 표시됩니다.</p>
      </form>
      <div id="out" aria-live="polite"></div>
      <p class="foot">신청이나 입금 후 반영까지 최대 1시간이 걸립니다. 입력한 정보는 서버로 전송되지 않고 이 화면 안에서만 확인됩니다.</p>
    </section>
  </main>
  <script>
  (function(){
    var DATA=null, form=document.getElementById('form'), out=document.getElementById('out'), upd=document.getElementById('updated');
    var enc=new TextEncoder();
    function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');}
    function sha(s){return crypto.subtle.digest('SHA-256',enc.encode(s)).then(hex);}
    function fmtDate(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?m[1]+'년 '+(+m[2])+'월 '+(+m[3])+'일':'';}
    function classify(raw){
      var v=raw.trim();
      if(v.indexOf('@')>-1) return {kind:'e',val:v.toLowerCase().replace(/\s+/g,'')};
      var digits=v.replace(/\D/g,'');
      if(/^[\d\s\-+().]+$/.test(v)&&digits.length>=9) return {kind:'p',val:digits};
      return {kind:'n',val:v.replace(/\s+/g,'')};
    }
    function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
    function decrypt(person,val){
      if(!person.e||!person.e.length) return Promise.resolve(null);
      return crypto.subtle.importKey('raw',enc.encode(val),'PBKDF2',false,['deriveKey']).then(function(k){
        return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(DATA.kdfSalt),iterations:DATA.kdfIter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
      }).then(function(key){
        var i=0;
        function next(){
          if(i>=person.e.length) return Promise.resolve(null);
          var raw=b64(person.e[i++]);
          return crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12)).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));},next);
        }
        return next();
      });
    }
    function line(cls,title,sub){return '<div class="line '+cls+'"><strong>'+esc(title)+'</strong>'+(sub?'<small>'+sub+'</small>':'')+'</div>';}
    function section(n,title,body){return '<div class="section"><h2><span class="num">'+n+'</span>'+title+'</h2><div class="lines">'+body+'</div></div>';}
    function render(p,links,kind){
      var a='',pay='',hw='',ct='',rc='',anyHw=false,anyPaid=false;
      p.c.forEach(function(c){
        a+=line('ok',c.t,'접수 확인'+(c.d?' · 신청일 '+fmtDate(c.d):''));
        if(c.p===1){pay+=line('ok',c.t,'입금 확인');}
        else if(c.p===2){pay+=line('na',c.t,'해당 없음 (무료 과정)');}
        else{pay+=line('wait',c.t,'입금 확인 중<br>입금을 했는데 반영이 되지 않았다면 개인톡 주세요');}
        if(c.h===1){hw+=line('ok',c.t,'과제 제출 확인');anyHw=true;}
        else if(c.h===0){hw+=line('wait',c.t,'과제 제출 확인 중');anyHw=true;}
      });
      if(!anyHw) hw=line('na','과제','해당 없음');
      if(p.k.length){
        p.k.forEach(function(k){ct+=line('ok',k.t+(k.g?' '+k.g:''),'발급 완료'+(k.d?' · 발급일 '+fmtDate(k.d):' · 발급일 기록 없음'));});
      } else if(p.ka){
        ct=line('wait','자격증','발급 이력 확인 중');
      } else if(p.kx){
        ct=line('wait','자격증','발급 전 · 발급되면 이 화면에 표시됩니다');
      } else {
        ct=line('na','자격증','해당 없음');
      }
      if(!p.r.length){rc=line('na','녹화본','해당 없음');}
      else p.r.forEach(function(r){
        if(r.s==='ready'){
          var info=links&&links.filter(function(x){return x.t===r.t;})[0];
          if(info){rc+='<div class="line ok"><strong>'+esc(r.t)+'</strong><small>시청 링크</small>'+info.l.map(function(l){return '<a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.n)+'</a>';}).join('')+'</div>';}
          else{rc+=line('ok',r.t,'전달 완료 · 시청 링크는 이메일 또는 전화번호로 조회하면 표시됩니다');}
        } else if(r.s==='pending'){rc+=line('wait',r.t,'녹화본 준비 중 · 완성되면 이메일로 안내합니다');}
        else if(r.s==='unpaid'){rc+=line('wait',r.t,'입금 확인 후 안내합니다');}
        else{rc+=line('wait',r.t,'전달 상태 확인 중');}
      });
      return section(1,'접수 확인',a)+section(2,'입금 확인',pay)+section(3,'과제 제출',hw)+section(4,'자격증 발급',ct)+section(5,'녹화본 시청',rc);
    }
    function lookup(raw){
      var q=classify(raw);
      if(!q.val){out.innerHTML='<div class="notice">조회할 내용을 입력해 주세요.</div>';return;}
      sha(DATA.salt+q.kind+'|'+q.val).then(function(hash){
        var hit=DATA.idx[hash]||[];
        if(!hit.length){out.innerHTML='<div class="notice">조회된 신청이 없습니다.<br>신청서에 적은 이름, 이메일, 전화번호와 같은지 확인해 주세요. 신청 직후라면 최대 1시간 뒤에 반영됩니다. 계속 조회되지 않으면 개인톡 주세요.</div>';return;}
        if(hit.length>1){out.innerHTML='<div class="notice">같은 정보로 신청한 분이 여러 명입니다.<br>이메일 또는 전화번호로 다시 조회해 주세요.</div>';return;}
        var p=DATA.people[hit[0]];
        var pre=(q.kind==='e'||q.kind==='p')?decrypt(p,q.val).catch(function(){return null;}):Promise.resolve(null);
        pre.then(function(links){out.innerHTML=render(p,links,q.kind);});
      });
    }
    form.addEventListener('submit',function(ev){
      ev.preventDefault();
      if(!window.crypto||!crypto.subtle){out.innerHTML='<div class="notice">이 브라우저에서는 조회를 사용할 수 없습니다. 최신 브라우저로 열어 주세요.</div>';return;}
      if(!DATA){out.innerHTML='<div class="notice">자료를 아직 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.</div>';return;}
      lookup(document.getElementById('q').value);
    });
    fetch('/data/my-courses.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
      DATA=d;upd.textContent='마지막 반영 '+d.updated;
    }).catch(function(){upd.textContent='자료를 불러오지 못했습니다';});
  })();
  </script>
</body>
</html>
