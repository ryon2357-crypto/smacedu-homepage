<!doctype html>
<!-- smac-travel-receipt-merged -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="refresh" content="6;url=/my-courses">
  <link rel="canonical" href="https://www.smacedu.kr/my-courses">
  <meta name="theme-color" content="#10243c">
  <title>내 수강 현황 조회로 이동</title>
  <style>
    :root { color-scheme: light; --ink:#10243c; --muted:#5e6b78; --line:#d9e1ea; --gold:#f4c15d; --cyan:#15a7b8; }
    * { box-sizing:border-box; }
    html { font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:#f6f8fb; }
    body { margin:0; min-height:100vh; background:linear-gradient(180deg,#eaf2f7 0,#f6f8fb 42rem); }
    .topline { height:7px; background:linear-gradient(90deg,var(--gold),#f09a55,var(--cyan)); }
    main { width:min(100% - 32px,640px); margin:0 auto; padding:48px 0 60px; }
    .brand { color:#426076; font-size:.9rem; font-weight:700; margin-bottom:12px; }
    h1 { margin:0 0 14px; font-size:clamp(1.7rem,6.5vw,2.5rem); line-height:1.2; letter-spacing:-.04em; }
    .card { background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 20px 60px rgba(26,55,82,.11); padding:clamp(22px,5vw,34px); }
    p { margin:0 0 12px; color:var(--muted); font-size:1.05rem; line-height:1.75; }
    ul { margin:4px 0 22px; padding-left:20px; color:var(--ink); line-height:1.9; font-size:1rem; }
    a.go { display:block; text-align:center; padding:18px 20px; border-radius:14px; background:var(--ink); color:#fff; font-weight:800; font-size:1.1rem; text-decoration:none; }
    a.go:hover { background:#183756; }
    a.go:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    .small { margin-top:14px; font-size:.88rem; text-align:center; }
  </style>
</head>
<body>
  <div class="topline"></div>
  <main>
    <div class="brand">스마트미디어아트센터</div>
    <div class="card">
      <h1>여행사진작가 접수 확인은 내 수강 현황 조회에서 보실 수 있습니다</h1>
      <p>여행사진작가 자격과정 접수 확인 페이지가 수강생 통합 조회로 합쳐졌습니다. 신청서에 적은 이름, 이메일 또는 전화번호로 조회하면 아래 내용을 한 화면에서 확인할 수 있습니다.</p>
      <ul>
        <li>접수와 입금 확인</li>
        <li>과제 제출 확인</li>
        <li>자격증 발급 여부</li>
        <li>녹화본 시청 링크</li>
      </ul>
      <a class="go" href="/my-courses">내 수강 현황 조회로 가기</a>
      <p class="small">잠시 후 자동으로 이동합니다.</p>
    </div>
  </main>
</body>
</html>
