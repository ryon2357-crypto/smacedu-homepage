<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>니콘 공식 판매점으로 이동 중</title>
<link rel="preconnect" href="https://mkt.shopping.naver.com">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0d0c0a;
    color: #f1ecde;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { width: min(88vw, 440px); text-align: center; }
  .spinner {
    width: 34px;
    height: 34px;
    margin: 0 auto 20px;
    border: 3px solid #332c1e;
    border-top-color: #f2c14e;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  h1 { margin: 0 0 10px; font-size: 1.15rem; }
  p { margin: 0; color: #b6ae9b; font-size: .92rem; line-height: 1.6; }
  a { color: #f2c14e; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="spinner" aria-hidden="true"></div>
  <h1>니콘 공식 판매점으로 이동 중입니다</h1>
  <p id="message">잠시만 기다려 주세요.</p>
</main>
<script>
(function(){
  var message = document.getElementById('message');
  var destination = '';

  try {
    destination = decodeURIComponent(location.hash.slice(1));
  } catch (error) {
    destination = '';
  }

  if (!/^https:\/\/mkt\.shopping\.naver\.com\/link\/[a-z0-9]+$/i.test(destination)) {
    message.textContent = '연결 주소를 확인할 수 없습니다. 이전 페이지로 돌아가 다시 눌러 주세요.';
    document.querySelector('.spinner').hidden = true;
    return;
  }

  var fallback = document.createElement('a');
  fallback.href = destination;
  fallback.rel = 'noopener noreferrer';
  fallback.textContent = '바로 이동하기';
  message.append(document.createElement('br'), fallback);

  window.setTimeout(function(){
    location.replace(destination);
  }, 650);
})();
</script>
</body>
</html>
