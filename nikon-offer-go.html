<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>니콘 공식 판매점으로 이동 중</title>
<link rel="preconnect" href="https://mkt.shopping.naver.com">
<script id="insights" defer src="/_vercel/insights/script.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0d0c0a;
    color: #f1ecde;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { width: min(88vw, 440px); text-align: center; }
  .spinner {
    width: 34px;
    height: 34px;
    margin: 0 auto 20px;
    border: 3px solid #332c1e;
    border-top-color: #f2c14e;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  h1 { margin: 0 0 10px; font-size: 1.15rem; }
  p { margin: 0; color: #b6ae9b; font-size: .92rem; line-height: 1.6; }
  a { color: #f2c14e; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="spinner" aria-hidden="true"></div>
  <h1>니콘 공식 판매점으로 이동 중입니다</h1>
  <p id="message">잠시만 기다려 주세요.</p>
</main>
<script>
(function(){
  var message = document.getElementById('message');
  var destination = '';

  try {
    destination = decodeURIComponent(location.hash.slice(1));
  } catch (error) {
    destination = '';
  }

  if (!/^https:\/\/mkt\.shopping\.naver\.com\/link\/[a-z0-9]+$/i.test(destination)) {
    message.textContent = '연결 주소를 확인할 수 없습니다. 이전 페이지로 돌아가 다시 눌러 주세요.';
    document.querySelector('.spinner').hidden = true;
    return;
  }

  var fallback = document.createElement('a');
  fallback.href = destination;
  fallback.rel = 'noopener noreferrer';
  fallback.textContent = '바로 이동하기';
  message.append(document.createElement('br'), fallback);

  // 클릭 집계가 나가기 전에 페이지를 넘겨버리면 그 클릭은 영영 안 잡힌다.
  // 그래서 고정 대기(650ms) 대신, 집계 스크립트가 실제로 뜬 걸 확인하고 넘어간다.
  // 스크립트는 엣지 캐시라 보통 금방 뜨므로 체감은 오히려 더 빨라진다.
  var moved = false;
  function go(){
    if (moved) return;
    moved = true;
    location.replace(destination);
  }

  var sent = false;
  function afterBeacon(){
    if (sent) return;
    sent = true;
    window.setTimeout(go, 200);   // 비콘이 실제로 나갈 짬
  }

  var insights = document.getElementById('insights');
  if (insights) {
    insights.addEventListener('load', afterBeacon);
    insights.addEventListener('error', go);  // 광고차단 등으로 막혔으면 기다릴 이유가 없다
  }
  if (window.va) afterBeacon();               // 이미 떠 있던 경우

  window.setTimeout(go, 1600);                // 무슨 일이 있어도 1.6초 안에는 넘긴다
})();
</script>
</body>
</html>
