<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자격증 정보 정정 신청 | 스마트미디어아트센터</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --orange:#f59e0b; --red:#ef4444; --ink:#1e293b; --sub:#64748b;
    --bg:#f8fafc; --border:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .card{
    width:100%; max-width:480px; background:#fff; border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08); overflow:hidden;
  }
  .head{
    background:linear-gradient(135deg,var(--orange),var(--red));
    padding:32px 28px; text-align:center;
  }
  .head h1{color:#fff; margin:0; font-size:21px; font-weight:900;}
  .head p{color:rgba(255,255,255,0.85); margin:8px 0 0; font-size:13.5px; line-height:1.6;}
  .body{padding:26px 28px 30px;}
  label{display:block; margin:16px 0 6px; font-weight:700; font-size:13.5px; color:var(--ink);}
  label:first-of-type{margin-top:0;}
  input, select, textarea{
    width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:9px;
    font-size:15px; font-family:inherit; box-sizing:border-box; background:#fff;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--orange);}
  textarea{min-height:64px; resize:vertical;}
  .hint{color:var(--sub); font-size:12px; margin-top:5px; line-height:1.5;}
  button{
    margin-top:22px; width:100%; padding:14px; border:none; border-radius:999px;
    background:linear-gradient(135deg,var(--orange),var(--red)); color:#fff;
    font-size:15.5px; font-weight:800; cursor:pointer;
  }
  button:disabled{opacity:0.6; cursor:default;}
  .msg{margin-top:14px; font-size:13.5px; text-align:center; display:none;}
  .msg.error{color:#dc2626; display:block;}
  #done{display:none; text-align:center; padding:20px 0 8px;}
  #done .emoji{font-size:38px;}
  #done h2{margin:12px 0 6px; font-size:19px;}
  #done p{color:var(--sub); font-size:14px; line-height:1.7; margin:0;}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>자격증 정보 정정 신청</h1>
    <p>신청 시 입력하신 이메일이나 생년월일이 잘못됐다면,<br>여기서 알려주세요. 확인 후 다시 발급해 드립니다.</p>
  </div>
  <div class="body">
    <form id="f">
      <label>성명 *</label>
      <input name="name" required>

      <label>신청하신 자격증 *</label>
      <select name="cert" required>
        <option value="">선택해주세요</option>
        <option>스마트폰사진작가 1급</option>
        <option>스마트폰사진작가 2급</option>
        <option>스마트폰사진전문가</option>
        <option>스마트폰활용지도사 1급</option>
        <option>스마트폰활용지도사 2급</option>
        <option>스마트미디어강사 1급</option>
        <option>스마트미디어강사 2급</option>
        <option>AI활용지도사 1급</option>
        <option>AI활용지도사 2급</option>
        <option>AI콘텐츠제작전문가 1급</option>
        <option>AI콘텐츠제작전문가 2급</option>
        <option>AI프롬프트전문가 1급</option>
        <option>AI프롬프트전문가 2급</option>
        <option>영상편집전문가 1급</option>
        <option>영상편집전문가 2급</option>
        <option>SNS마케팅지도사 1급</option>
        <option>SNS마케팅지도사 2급</option>
        <option>1인콘텐츠창작전문가 1급</option>
        <option>1인콘텐츠창작전문가 2급</option>
        <option>여행사진작가 1급</option>
        <option>여행사진작가 2급</option>
        <option>사진힐링전문가 1급</option>
        <option>사진힐링전문가 2급</option>
        <option>디지털콘텐츠전문가 1급</option>
        <option>디지털콘텐츠전문가 2급</option>
        <option>디지털디자인전문가 1급</option>
        <option>디지털디자인전문가 2급</option>
      </select>

      <label>원래 자격번호(아시면 입력, 모르면 비워두세요)</label>
      <input name="certNo" placeholder="예: 제2026-AICS-0074호">

      <label>정정할 이메일 *</label>
      <input name="email" type="email" required placeholder="자격증을 받으실 이메일">

      <label>정정할 생년월일(생년월일은 맞으면 비워두세요)</label>
      <input name="birth" placeholder="예: 1976-06-24">

      <label>비고</label>
      <textarea name="note" placeholder="상황을 간단히 적어주세요(선택)"></textarea>

      <button type="submit" id="btn">정정 신청하기</button>
      <p class="msg" id="msg"></p>
    </form>
    <div id="done">
      <div class="emoji">✅</div>
      <h2>접수됐습니다</h2>
      <p>확인 후 재발급되면<br>입력하신 이메일로 자격증을 다시 보내드립니다.</p>
    </div>
  </div>
</div>
<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz47FQesvuy7rBzB_VYye85Vj6cjDpstFYTVvdNnDdjsNyb_HgD4DQM-vi6udtSZApa/exec';

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    const btn  = document.getElementById('btn');
    const msg  = document.getElementById('msg');
    msg.style.display = 'none';

    const email = form.email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.textContent = '올바른 이메일 형식이 아닙니다.';
      msg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = '전송 중…';

    const data = new FormData(form);
    data.append('form', 'certcorrection');
    const params = new URLSearchParams();
    for (const [k, v] of data.entries()) params.append(k, v);

    try {
      await fetch(`${SCRIPT_URL}?${params}`, { mode: 'no-cors' });
      form.style.display = 'none';
      document.getElementById('done').style.display = 'block';
    } catch {
      msg.textContent = '전송 실패, 다시 시도해주세요.';
      msg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = '정정 신청하기';
    }
  });
</script>
</body>
</html>
